name: Build LaNgKaT Utility Tools

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller pillow pillow

      - name: Build EXE
        run: pyinstaller --noconfirm --windowed --name "LaNgKaT_Utility_Tools" --add-data "langkat_icon.png;." LaNgKaT_Desktop.py

      - name: Create ZIP
        shell: powershell
        run: Compress-Archive -Path "dist\LaNgKaT_Utility_Tools\*" -DestinationPath "LaNgKaT_Utility_Tools_Windows.zip"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: LaNgKaT-Utility-Tools-Windows
          path: LaNgKaT_Utility_Tools_Windows.zip
